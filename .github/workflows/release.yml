name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build, Test, and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main --depth=1000
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "Tag ${{ github.ref_name }} does not point to a commit on main. Aborting."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build WebApp
        working-directory: WebApp
        run: mvn -B package

      - name: Start WebApp
        working-directory: WebApp
        run: |
          nohup java -jar target/*.jar > ../webapp.log 2>&1 &
          echo $! > ../webapp.pid

      - name: Wait for WebApp to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/login > /dev/null; then
              echo "WebApp is up"
              exit 0
            fi
            sleep 2
          done
          echo "WebApp did not become ready in time"
          cat webapp.log
          exit 1

      - name: Set up Firefox
        uses: browser-actions/setup-firefox@latest

      - name: Set up Edge
        uses: browser-actions/setup-edge@v1

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install web_app_testing dependencies
        working-directory: web_app_testing
        run: uv sync

      - name: Set web_app_testing version from tag
        working-directory: web_app_testing
        run: uv version "${GITHUB_REF_NAME#v}"

      - name: Run smoke tests
        id: smoke
        working-directory: web_app_testing
        continue-on-error: true
        run: xvfb-run -a uv run pytest tests/smoke --alluredir=allure-results

      - name: Run system tests
        id: system
        working-directory: web_app_testing
        continue-on-error: true
        run: xvfb-run -a uv run pytest tests/ui --alluredir=allure-results

      - name: Generate Allure report
        if: always() && steps.smoke.outcome != 'skipped'
        working-directory: web_app_testing
        run: |
          npm install -g allure-commandline --save-dev
          allure generate ./allure-results --clean -o ./allure-report

      - name: Upload Allure report artifact
        if: always() && steps.smoke.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.ref_name }}
          path: web_app_testing/allure-report
          if-no-files-found: warn

      - name: Fail if smoke tests failed
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Smoke tests failed. Aborting before release."
          exit 1

      - name: Push release
        if: steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" WebApp/target/*.jar \
            --title "${{ github.ref_name }}" \
            --generate-notes
