name: Release

on:
  push:
    branches:
      - main

jobs:
  version:
    name: Determine next version
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.version.outputs.new_version }}
      new-tag: ${{ steps.version.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next semver from conventional commits
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: patch
          with_v: true
          dry_run: true

  test:
    name: Build and Test
    needs: version
    runs-on: ubuntu-latest
    outputs:
      smoke-outcome: ${{ steps.smoke.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build WebApp
        working-directory: WebApp
        run: mvn -B package

      - name: Start WebApp
        working-directory: WebApp
        run: |
          nohup java -jar target/*.jar > ../webapp.log 2>&1 &
          echo $! > ../webapp.pid

      - name: Wait for WebApp to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/login > /dev/null; then
              echo "WebApp is up"
              exit 0
            fi
            sleep 2
          done
          echo "WebApp did not become ready in time"
          cat webapp.log
          exit 1

      - name: Set up Firefox
        uses: browser-actions/setup-firefox@latest

      - name: Set up Edge
        uses: browser-actions/setup-edge@v1

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install web_app_testing dependencies
        working-directory: web_app_testing
        run: uv sync

      - name: Set web_app_testing version from upcoming tag
        working-directory: web_app_testing
        continue-on-error: true
        run: uv version "${{ needs.version.outputs.new-version }}"

      - name: Run smoke tests
        id: smoke
        working-directory: web_app_testing
        continue-on-error: true
        run: xvfb-run -a uv run pytest tests/smoke --alluredir=allure-results

      - name: Run system tests
        id: system
        working-directory: web_app_testing
        continue-on-error: true
        run: xvfb-run -a uv run pytest tests/ui --alluredir=allure-results

      - name: Generate Allure report
        if: always() && steps.smoke.outcome != 'skipped'
        working-directory: web_app_testing
        continue-on-error: true
        run: |
          npm install -g allure-commandline --save-dev
          allure generate ./allure-results --clean -o ./allure-report

      - name: Upload Allure report artifact
        if: always() && steps.smoke.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.sha }}
          path: web_app_testing/allure-report
          if-no-files-found: warn

      - name: Fail if smoke tests failed
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Smoke tests failed. Aborting before release."
          exit 1

  release:
    name: Tag and Release
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        env:
          NEW_TAG: ${{ needs.version.outputs.new-tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set WebApp version from tag
        working-directory: WebApp
        run: mvn -B versions:set -DnewVersion="${{ needs.version.outputs.new-version }}" -DgenerateBackupPoms=false

      - name: Build WebApp
        working-directory: WebApp
        run: mvn -B package -DskipTests

      - name: Push release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.new-tag }}" WebApp/target/*.jar \
            --title "${{ needs.version.outputs.new-tag }}" \
            --generate-notes
