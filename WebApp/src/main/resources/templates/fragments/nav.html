<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<style th:fragment="global-style">
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        max-width: 900px;
        margin: 0 auto;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        line-height: 1.5;
    }
    h1 { font-size: 1.75rem; margin: 0 0 16px; }
    h2 { font-size: 1.25rem; margin: 32px 0 12px; }
    nav {
        display: flex;
        align-items: center;
        gap: 16px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 24px;
    }
    nav a, nav button {
        color: #2563eb;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.95rem;
    }
    nav a:hover, nav button:hover { text-decoration: underline; cursor: pointer; }
    nav button {
        background: none;
        border: none;
        padding: 0;
        font-family: inherit;
    }
    nav form { margin-left: auto; }
    table {
        width: 100%;
        border-collapse: collapse;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    th, td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid #e2e8f0;
    }
    thead { background: #f1f5f9; }
    tbody tr:last-child td { border-bottom: none; }
    form {
        max-width: 420px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 20px;
    }
    .field {
        display: flex;
        flex-direction: column;
        margin-bottom: 14px;
    }
    .field label {
        font-weight: 600;
        font-size: 0.85rem;
        margin-bottom: 6px;
        color: #334155;
    }
    .field input[type="text"],
    .field input[type="password"],
    .field input[type="number"] {
        padding: 8px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 0.95rem;
    }
    .field-checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
    }
    .field-checkbox label { font-weight: 500; font-size: 0.9rem; }
    button[type="submit"] {
        background: #2563eb;
        color: #ffffff;
        border: none;
        padding: 9px 18px;
        border-radius: 6px;
        font-size: 0.95rem;
        cursor: pointer;
    }
    button[type="submit"]:hover { background: #1d4ed8; }
    .error {
        color: #b91c1c;
        background: #fee2e2;
        border: 1px solid #fecaca;
        padding: 10px 14px;
        border-radius: 6px;
        margin-bottom: 16px;
    }
    #view-all-toggle {
        display: inline-block;
        margin-bottom: 16px;
        color: #2563eb;
        font-weight: 500;
    }
</style>
<body>
<nav th:fragment="nav">
    <a href="/orders">Orders</a>
    <a href="/stock">Stock</a>
    <a href="/users" sec:authorize="hasAuthority('MANAGE_USERS')">Users</a>
    <form th:action="@{/logout}" method="post"><button type="submit">Log out</button></form>
</nav>
</body>
</html>
