[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
dynamic = ["version"]
name = "web-app-test"
description = "Tests WebApp using pytest and Selenium"
requires-python = ">=3.10"
readme="README.md"
authors = [
    {name = "Rye Fry", email = "contact@ryefry.com"}
]
dependencies = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "selenium>=4.47",
    "requests>=2.34"
]
